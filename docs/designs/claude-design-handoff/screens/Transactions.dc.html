<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet><style>body{margin:0;}</style></helmet>
<div style="{{ rootStyle }}">
  <dc-import name="Sidebar" active="Transactions.dc.html" theme="{{ theme }}" style="{{ sidebarMountStyle }}" hint-size="240px,100vh"></dc-import>
  <div style="{{ mainColStyle }}">
    <dc-import name="Topbar" title="Transactions" theme="{{ theme }}" on-toggle-theme="{{ toggleTheme }}" hint-size="100%,56px"></dc-import>
    <div style="{{ scrollAreaStyle }}">
    <main style="{{ contentStyle }}">
      <header style="{{ pageHeaderStyle }}"><h1 style="{{ pageTitleStyle }}">Transactions</h1><a href="PaymentEntry.dc.html" style="{{ btnPrimaryLinkStyle }}">New Payment</a></header>
      <div style="{{ filterBarStyle }}">
        <input type="search" style="{{ searchInputStyle }}" placeholder="Search transactions..." value="{{ search }}" onInput="{{ onSearch }}"></input>
        <select style="{{ selectStyle }}" value="{{ typeFilter }}" onChange="{{ onTypeFilter }}">
          <option value="">All Types</option><option value="Income">Income</option><option value="Expense">Expense</option>
        </select>
      </div>
      <div style="{{ tableWrapStyle }}">
        <table style="{{ tableStyle }}">
          <thead><tr><th style="{{ thStyle }}">Date</th><th style="{{ thStyle }}">Description</th><th style="{{ thStyle }}">Account</th><th style="{{ thStyle }}">Type</th><th style="{{ thNumStyle }}">Amount</th></tr></thead>
          <tbody>
            <sc-for list="{{ pageRows }}" as="t" hint-placeholder-count="8">
              <tr><td style="{{ tdStyle }}">{{ t.date }}</td><td style="{{ tdStyle }}">{{ t.desc }}</td><td style="{{ tdStyle }}">{{ t.account }}</td><td style="{{ tdStyle }}"><span style="{{ t.chipStyle }}">{{ t.type }}</span></td><td style="{{ t.amountStyle }}">{{ t.amount }}</td></tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><div style="{{ emptyStyle }}"><h3 style="{{ emptyTitleStyle }}">No transactions found</h3><p style="{{ emptyTextStyle }}">Try adjusting your search or filters.</p></div></sc-if>
    </main>
    <dc-import name="Footer" theme="{{ theme }}" hint-size="100%,40px"></dc-import>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const DARK = { bg:'#010101', surface:'#080808', border:'rgba(111,126,143,0.32)', ink:'#FAFAFA', inkHi:'#FBFAFB', inkDim:'#F8F8F9', muted:'#717F91', accent:'#717F91', accentInk:'#010101', success:'#63A583', danger:'#CD6A5E' };
const LIGHT = { bg:'#FBFAFB', surface:'#FFFFFF', border:'rgba(111,126,143,0.30)', ink:'#121417', inkHi:'#010101', inkDim:'#3A414B', muted:'#5A6675', accent:'#4A5563', accentInk:'#FBFAFB', success:'#2E7D54', danger:'#B23A2E' };
const FONT = "'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
const fmt=(n)=>(n<0?'-':'')+'৳'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2});
function chip(type,C){ const color=type==='Income'?C.success:C.danger; return {display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:999,fontSize:12,fontWeight:500,fontFamily:FONT,color,border:`1px solid ${color}`}; }
const SEED=[
 {id:1,date:'2026-08-28',desc:'Invoice payment - Acme Corp',account:'HSBC Current',type:'Income',amount:1500000},
 {id:2,date:'2026-08-27',desc:'Payroll - August',account:'HSBC Current',type:'Expense',amount:-2800000},
 {id:3,date:'2026-08-25',desc:'Office rent',account:'Petty Cash',type:'Expense',amount:-120000},
 {id:4,date:'2026-08-22',desc:'Invoice payment - Ekushey Solutions',account:'Dutch-Bangla Savings',type:'Income',amount:3500000},
 {id:5,date:'2026-08-20',desc:'Software subscriptions',account:'bKash Merchant',type:'Expense',amount:-45000},
 {id:6,date:'2026-08-18',desc:'Invoice payment - Bayzid Group',account:'HSBC Current',type:'Income',amount:2250000},
 {id:7,date:'2026-08-15',desc:'BDS commission - Rahim Hassan',account:'HSBC Current',type:'Expense',amount:-75000},
 {id:8,date:'2026-08-10',desc:'Client travel reimbursement',account:'Petty Cash',type:'Expense',amount:-18000}
];
class Component extends DCLogic {
  state={theme:'dark',search:'',typeFilter:'',transactions:SEED};
  componentDidMount(){ try{this.setState({theme:localStorage.getItem('hub-theme')||'dark'});}catch(e){} }
  toggleTheme=()=>this.setState(s=>{const n=s.theme==='light'?'dark':'light';try{localStorage.setItem('hub-theme',n);}catch(e){}return{theme:n};});
  onSearch=(e)=>this.setState({search:e.target.value}); onTypeFilter=(e)=>this.setState({typeFilter:e.target.value});
  renderVals(){
    const C=this.state.theme==='light'?LIGHT:DARK;
    const filtered=this.state.transactions.filter(t=>(!this.state.search||t.desc.toLowerCase().includes(this.state.search.toLowerCase()))&&(!this.state.typeFilter||t.type===this.state.typeFilter));
    const pageRows=filtered.map(t=>({...t,amount:fmt(t.amount),chipStyle:chip(t.type,C),amountStyle:{padding:'12px 16px',color:t.amount<0?C.danger:C.success,fontWeight:500,textAlign:'right',fontVariantNumeric:'tabular-nums',borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'}}));
    const btnBase={display:'inline-flex',alignItems:'center',gap:4,borderRadius:4,border:'1px solid transparent',cursor:'pointer',fontFamily:FONT,fontSize:14,padding:'8px 16px'};
    return {
      theme:this.state.theme,toggleTheme:this.toggleTheme,search:this.state.search,typeFilter:this.state.typeFilter,onSearch:this.onSearch,onTypeFilter:this.onTypeFilter,
      pageRows,noResults:pageRows.length===0,
      rootStyle: { display: 'flex', height: '100vh', overflow: 'hidden', background: C.bg },sidebarMountStyle:{flexShrink:0},mainColStyle: { flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }, scrollAreaStyle: { flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', overflowY: 'auto' },
      contentStyle:{padding:'32px 24px 64px',maxWidth:1280,width:'100%',boxSizing:'border-box',margin:'0 auto', flex: 1},
      pageHeaderStyle:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:24,marginBottom:24,flexWrap:'wrap'},
      pageTitleStyle:{color:C.inkHi,fontSize:20,lineHeight:'28px',fontWeight:600,fontFamily:FONT,margin:0},
      btnPrimaryLinkStyle:{...btnBase,background:C.accent,color:C.accentInk,textDecoration:'none'},
      filterBarStyle:{display:'flex',gap:12,flexWrap:'wrap',marginBottom:24},
      searchInputStyle:{background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:'8px 12px',color:C.ink,fontFamily:FONT,fontSize:14,minWidth:220},
      selectStyle:{background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:'8px 12px',color:C.ink,fontFamily:FONT,fontSize:14},
      tableWrapStyle:{overflowX:'auto',border:`1px solid ${C.border}`,borderRadius:8},tableStyle:{width:'100%',borderCollapse:'collapse',fontSize:13,fontFamily:FONT},
      thStyle:{padding:'12px 16px',textAlign:'left',color:C.muted,fontSize:12,fontWeight:500,letterSpacing:'0.04em',textTransform:'uppercase',borderBottom:`1px solid ${C.border}`},
      thNumStyle:{padding:'12px 16px',textAlign:'right',color:C.muted,fontSize:12,fontWeight:500,letterSpacing:'0.04em',textTransform:'uppercase',borderBottom:`1px solid ${C.border}`},
      tdStyle:{padding:'12px 16px',color:C.inkDim,borderBottom:`1px solid ${C.border}`},
      emptyStyle:{color:C.muted,textAlign:'center',padding:48,fontFamily:FONT},emptyTitleStyle:{color:C.inkHi,fontFamily:FONT,margin:'0 0 8px'},emptyTextStyle:{margin:0,fontSize:14}
    };
  }
}
</script>
</body>
</html>
