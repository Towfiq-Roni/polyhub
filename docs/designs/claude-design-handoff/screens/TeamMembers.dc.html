<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet><style>body{margin:0;}</style></helmet>
<div style="{{ rootStyle }}">
  <dc-import name="Sidebar" active="TeamMembers.dc.html" theme="{{ theme }}" style="{{ sidebarMountStyle }}" hint-size="240px,100vh"></dc-import>
  <div style="{{ mainColStyle }}">
    <dc-import name="Topbar" title="Team Members" theme="{{ theme }}" on-toggle-theme="{{ toggleTheme }}" hint-size="100%,56px"></dc-import>
    <div style="{{ scrollAreaStyle }}">
    <main style="{{ contentStyle }}">
      <header style="{{ pageHeaderStyle }}">
        <h1 style="{{ pageTitleStyle }}">Team Members</h1>
        <button type="button" style="{{ btnPrimaryStyle }}" onClick="{{ openCreate }}">Add Member</button>
      </header>
      <div style="{{ filterBarStyle }}">
        <input type="search" style="{{ searchInputStyle }}" placeholder="Search members..." value="{{ search }}" onInput="{{ onSearch }}"></input>
        <select style="{{ selectStyle }}" value="{{ teamFilter }}" onChange="{{ onTeamFilter }}">
          <option value="">All Teams</option>
          <option value="Engineering">Engineering</option><option value="Design">Design</option><option value="QA & Testing">QA & Testing</option><option value="DevOps">DevOps</option><option value="Sales">Sales</option>
        </select>
      </div>
      <div style="{{ tableWrapStyle }}">
        <table style="{{ tableStyle }}">
          <thead><tr><th style="{{ thStyle }}">Member</th><th style="{{ thStyle }}">Team</th><th style="{{ thStyle }}">Role</th><th style="{{ thStyle }}">Email</th><th style="{{ thStyle }}">Rate</th><th style="{{ thStyle }}">Joined</th><th style="{{ thStyle }}">Status</th><th style="{{ thStyle }}"></th></tr></thead>
          <tbody>
            <sc-for list="{{ pageRows }}" as="m" hint-placeholder-count="8">
              <tr>
                <td style="{{ tdStyle }}"><div style="{{ memberCellStyle }}"><span style="{{ m.avatarStyle }}">{{ m.initials }}</span><a href="{{ m.detailHref }}" style="{{ linkStyle }}">{{ m.name }}</a></div></td>
                <td style="{{ tdStyle }}">{{ m.team }}</td>
                <td style="{{ tdStyle }}">{{ m.role }}</td>
                <td style="{{ tdStyle }}">{{ m.email }}</td>
                <td style="{{ tdNumStyle }}">{{ m.rate }}</td>
                <td style="{{ tdStyle }}">{{ m.joined }}</td>
                <td style="{{ tdStyle }}"><span style="{{ statusChip }}">{{ m.status }}</span></td>
                <td style="{{ tdStyle }}"><a href="{{ m.detailHref }}" style="{{ btnGhostSmLinkStyle }}">View</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><div style="{{ emptyStyle }}"><h3 style="{{ emptyTitleStyle }}">No team members found</h3><p style="{{ emptyTextStyle }}">Try adjusting your search or filters.</p></div></sc-if>

      <sc-if value="{{ createOpen }}" hint-placeholder-val="{{ false }}">
        <div style="{{ modalScrimStyle }}" onClick="{{ closeCreate }}"></div>
        <div style="{{ modalCardStyle }}" role="dialog" aria-label="Add member">
          <div style="{{ modalHeaderStyle }}"><h2 style="{{ modalTitleStyle }}">Add Member</h2></div>
          <div style="{{ modalBodyStyle }}">
            <label style="{{ labelStyle }}">Full name</label>
            <input type="text" style="{{ modalInputStyle }}" value="{{ newName }}" onInput="{{ onNewName }}" placeholder="e.g. Jamil Hossain"></input>
            <sc-if value="{{ nameError }}" hint-placeholder-val="{{ false }}"><div style="{{ errorTextStyle }}">Name is required.</div></sc-if>
            <label style="{{ labelStyle }}">Team</label>
            <select style="{{ modalInputStyle }}" value="{{ newTeam }}" onChange="{{ onNewTeam }}">
              <option value="Engineering">Engineering</option><option value="Design">Design</option><option value="QA & Testing">QA & Testing</option><option value="DevOps">DevOps</option><option value="Sales">Sales</option>
            </select>
            <label style="{{ labelStyle }}">Role</label>
            <input type="text" style="{{ modalInputStyle }}" value="{{ newRole }}" onInput="{{ onNewRole }}" placeholder="e.g. Developer"></input>
            <label style="{{ labelStyle }}">Email</label>
            <input type="email" style="{{ modalInputStyle }}" value="{{ newEmail }}" onInput="{{ onNewEmail }}" placeholder="name@polygon.bd"></input>
            <label style="{{ labelStyle }}">Hourly rate (৳)</label>
            <input type="number" style="{{ modalInputStyle }}" value="{{ newRate }}" onInput="{{ onNewRate }}" placeholder="0"></input>
          </div>
          <div style="{{ modalFooterStyle }}">
            <button type="button" style="{{ btnGhostStyle }}" onClick="{{ closeCreate }}">Cancel</button>
            <button type="button" style="{{ btnPrimaryStyle }}" onClick="{{ submitCreate }}">Add Member</button>
          </div>
        </div>
      </sc-if>
    </main>
    <dc-import name="Footer" theme="{{ theme }}" hint-size="100%,40px"></dc-import>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const DARK = { bg:'#010101', surface:'#080808', border:'rgba(111,126,143,0.32)', ink:'#FAFAFA', inkHi:'#FBFAFB', inkDim:'#F8F8F9', muted:'#717F91', accent:'#717F91', accentInk:'#010101', accentSoft:'rgba(113,127,145,0.14)', success:'#63A583', danger:'#CD6A5E' };
const LIGHT = { bg:'#FBFAFB', surface:'#FFFFFF', border:'rgba(111,126,143,0.30)', ink:'#121417', inkHi:'#010101', inkDim:'#3A414B', muted:'#5A6675', accent:'#4A5563', accentInk:'#FBFAFB', accentSoft:'rgba(74,85,99,0.12)', success:'#2E7D54', danger:'#B23A2E' };
const FONT = "'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
function initials(n){ return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
const SEED = [
  { id:1, name:'Rahim Uddin', team:'Engineering', role:'Project Manager', email:'rahim@polygon.bd', rate:'৳2,500.00/hr', joined:'2024-01-15', status:'Active' },
  { id:2, name:'Karim Ali', team:'Engineering', role:'Senior Developer', email:'karim@polygon.bd', rate:'৳1,800.00/hr', joined:'2024-03-01', status:'Active' },
  { id:3, name:'Farida Akter', team:'Design', role:'Senior Developer', email:'farida@polygon.bd', rate:'৳1,800.00/hr', joined:'2024-05-10', status:'Active' },
  { id:4, name:'Nadia Rahman', team:'QA & Testing', role:'QA Engineer', email:'nadia@polygon.bd', rate:'৳1,200.00/hr', joined:'2025-02-01', status:'Active' },
  { id:5, name:'Mahmudul Islam', team:'DevOps', role:'DevOps Engineer', email:'mahmud@polygon.bd', rate:'৳2,000.00/hr', joined:'2025-06-15', status:'Active' },
  { id:6, name:'Tasnim Ahmed', team:'Sales', role:'Account Executive', email:'tasnim@polygon.bd', rate:'৳1,500.00/hr', joined:'2025-09-01', status:'Active' },
  { id:7, name:'Rahima Khatun', team:'Sales', role:'Business Developer', email:'rahima@polygon.bd', rate:'৳1,500.00/hr', joined:'2025-11-15', status:'Active' },
  { id:8, name:'Kamal Hossain', team:'Engineering', role:'Developer', email:'kamal@polygon.bd', rate:'৳1,500.00/hr', joined:'2026-01-20', status:'Active' }
];
class Component extends DCLogic {
  state = { theme:'dark', search:'', teamFilter:'', members: SEED, createOpen:false, newName:'', newTeam:'Engineering', newRole:'', newEmail:'', newRate:'', nameError:false };
  componentDidMount(){ try{ this.setState({ theme: localStorage.getItem('hub-theme')||'dark' }); }catch(e){} this.persist(); }
  persist(){ try{ localStorage.setItem('hub-team-members', JSON.stringify(this.state.members)); }catch(e){} }
  toggleTheme=()=>this.setState(s=>{ const n=s.theme==='light'?'dark':'light'; try{localStorage.setItem('hub-theme',n);}catch(e){} return {theme:n}; });
  onSearch=(e)=>this.setState({search:e.target.value});
  onTeamFilter=(e)=>this.setState({teamFilter:e.target.value});
  openCreate=()=>this.setState({createOpen:true,newName:'',newTeam:'Engineering',newRole:'',newEmail:'',newRate:'',nameError:false});
  closeCreate=()=>this.setState({createOpen:false});
  onNewName=(e)=>this.setState({newName:e.target.value});
  onNewTeam=(e)=>this.setState({newTeam:e.target.value});
  onNewRole=(e)=>this.setState({newRole:e.target.value});
  onNewEmail=(e)=>this.setState({newEmail:e.target.value});
  onNewRate=(e)=>this.setState({newRate:e.target.value});
  submitCreate=()=>{
    if(!this.state.newName.trim()){ this.setState({nameError:true}); return; }
    const rate=parseFloat(this.state.newRate);
    const m={id:Date.now(),name:this.state.newName.trim(),team:this.state.newTeam,role:this.state.newRole.trim()||'—',email:this.state.newEmail.trim()||'—',rate:isNaN(rate)?'—':'৳'+rate.toLocaleString('en-US',{minimumFractionDigits:2})+'/hr',joined:new Date().toISOString().slice(0,10),status:'Active'};
    this.setState(s=>({members:[m,...s.members],createOpen:false}), ()=>this.persist());
  };
  renderVals(){
    const C = this.state.theme==='light'?LIGHT:DARK;
    const filtered = this.state.members.filter(m=>(!this.state.search||m.name.toLowerCase().includes(this.state.search.toLowerCase()))&&(!this.state.teamFilter||m.team===this.state.teamFilter));
    const pageRows = filtered.map(m=>({...m, initials:initials(m.name), detailHref:'TeamMemberDetail.dc.html?id='+m.id}));
    const btnBase={display:'inline-flex',alignItems:'center',gap:4,borderRadius:4,border:'1px solid transparent',cursor:'pointer',fontFamily:FONT,fontSize:14,padding:'8px 16px'};
    return {
      theme:this.state.theme, toggleTheme:this.toggleTheme, search:this.state.search, teamFilter:this.state.teamFilter, onSearch:this.onSearch, onTeamFilter:this.onTeamFilter,
      pageRows, noResults: pageRows.length===0,
      createOpen:this.state.createOpen, openCreate:this.openCreate, closeCreate:this.closeCreate, newName:this.state.newName, newTeam:this.state.newTeam, newRole:this.state.newRole, newEmail:this.state.newEmail, newRate:this.state.newRate, nameError:this.state.nameError,
      onNewName:this.onNewName, onNewTeam:this.onNewTeam, onNewRole:this.onNewRole, onNewEmail:this.onNewEmail, onNewRate:this.onNewRate, submitCreate:this.submitCreate,
      rootStyle: { display: 'flex', height: '100vh', overflow: 'hidden', background: C.bg }, sidebarMountStyle:{flexShrink:0}, mainColStyle: { flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }, scrollAreaStyle: { flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', overflowY: 'auto' },
      contentStyle:{padding:'32px 24px 64px',maxWidth:1280,width:'100%',boxSizing:'border-box',margin:'0 auto', flex: 1},
      pageHeaderStyle:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:24,marginBottom:24,flexWrap:'wrap'},
      pageTitleStyle:{color:C.inkHi,fontSize:20,lineHeight:'28px',fontWeight:600,fontFamily:FONT,margin:0},
      btnPrimaryStyle:{...btnBase,background:C.accent,color:C.accentInk}, btnGhostStyle:{...btnBase,background:'transparent',color:C.ink,borderColor:C.border},
      btnGhostSmLinkStyle:{display:'inline-flex',alignItems:'center',borderRadius:4,border:`1px solid ${C.border}`,color:C.ink,fontFamily:FONT,fontSize:12,padding:'4px 12px',textDecoration:'none'},
      filterBarStyle:{display:'flex',gap:12,flexWrap:'wrap',marginBottom:24},
      searchInputStyle:{background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:'8px 12px',color:C.ink,fontFamily:FONT,fontSize:14,minWidth:220},
      selectStyle:{background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:'8px 12px',color:C.ink,fontFamily:FONT,fontSize:14},
      tableWrapStyle:{overflowX:'auto',border:`1px solid ${C.border}`,borderRadius:8},
      tableStyle:{width:'100%',borderCollapse:'collapse',fontSize:13,fontFamily:FONT},
      thStyle:{padding:'12px 16px',textAlign:'left',color:C.muted,fontSize:12,fontWeight:500,letterSpacing:'0.04em',textTransform:'uppercase',whiteSpace:'nowrap',borderBottom:`1px solid ${C.border}`},
      tdStyle:{padding:'12px 16px',color:C.inkDim,borderBottom:`1px solid ${C.border}`}, tdNumStyle:{padding:'12px 16px',color:C.inkHi,fontWeight:500,textAlign:'right',fontVariantNumeric:'tabular-nums',borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'},
      memberCellStyle:{display:'flex',alignItems:'center',gap:12}, linkStyle:{color:C.ink,textDecoration:'none'},
      statusChip:{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:999,fontSize:12,fontWeight:500,fontFamily:FONT,color:C.success,border:`1px solid ${C.success}`},
      emptyStyle:{color:C.muted,textAlign:'center',padding:48,fontFamily:FONT}, emptyTitleStyle:{color:C.inkHi,fontFamily:FONT,margin:'0 0 8px'}, emptyTextStyle:{margin:0,fontSize:14},
      modalScrimStyle:{position:'fixed',inset:0,background:'rgba(1,1,1,0.6)',zIndex:55},
      modalCardStyle:{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',zIndex:61,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,width:'min(420px, 90vw)',boxShadow:'0 8px 24px rgba(0,0,0,0.55)'},
      modalHeaderStyle:{padding:24,borderBottom:`1px solid ${C.border}`}, modalTitleStyle:{color:C.inkHi,fontFamily:FONT,fontSize:16,fontWeight:600,margin:0},
      modalBodyStyle:{padding:24,display:'flex',flexDirection:'column',gap:12}, modalFooterStyle:{display:'flex',justifyContent:'flex-end',gap:8,padding:24,borderTop:`1px solid ${C.border}`},
      labelStyle:{color:C.muted,fontSize:12,fontFamily:FONT}, modalInputStyle:{background:C.bg,border:`1px solid ${C.border}`,borderRadius:4,padding:'8px 12px',color:C.ink,fontFamily:FONT,fontSize:14,width:'100%',boxSizing:'border-box'},
      errorTextStyle:{color:C.danger,fontSize:12,fontFamily:FONT}
    };
  }
}
</script>
</body>
</html>
